<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediTrack | Login</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
<div class="logo">
<h1>MediTrack</h1>
<p class="subtitle">Track your medications easily</p>
</div>

<h2>Login</h2>

<form id="loginForm">
<div class="form-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password" required>
</div>

<button type="submit" id="loginBtn">Login</button>
</form>

<div id="message"></div>

<div class="link">
Don't have an account?  
<a href="index.html">Sign up here</a>
</div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
e.preventDefault();

const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

const btn = document.getElementById('loginBtn');
const message = document.getElementById('message');

btn.disabled = true;
btn.textContent = "Logging in...";

try {
const response = await fetch('http://localhost:3000/api/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({email, password})
});

const data = await response.json();

if (data.success) {
localStorage.setItem('userId', data.user.id);
localStorage.setItem('userEmail', data.user.email);
message.innerHTML = '<div class="message success">Login successful! Redirecting...</div>';
setTimeout(() => {
window.location.href = "dashboard.html";
}, 1500);
} else {
message.innerHTML = `<div class="message error">${data.message}</div>`;
}
} catch (error) {
message.innerHTML = '<div class="message error">Server error. Is backend running?</div>';
}

btn.disabled = false;
btn.textContent = "Login";
});
</script>
</body>
</html>
